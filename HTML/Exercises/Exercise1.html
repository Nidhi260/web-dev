<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure HTML Media Player</title>
</head>
<body>
    <header>
        <h1>Exercise1: Pure HTML Media Player</h1>
    </header>
    <main>
    <section>
        <h2>Audio Collection</h2>
        <figure>
            <figcaption>Track 1: A call to the soul </figcaption>
            <audio src = "a-call-to-the-soul.mp3" controls></audio>
        </figure>
         <figure>
            <figcaption>Track 2: Cinematic_epic </figcaption>
            <audio src = "cinematic-epic-inspiring.mp3" controls></audio>
        </figure>
         <figure>
            <figcaption>Track 3: Feel Good </figcaption>
            <audio src = "feel-good-background-music.mp3" controls></audio>
        </figure>
         <figure>
            <figcaption>Track 4: Powerful Action </figcaption>
            <audio src = "powerful-action-sports-metal-music.mp3" controls></audio>
        </figure>
         <figure>
            <figcaption>Track 5: Royalty Jazz </figcaption>
            <audio src = "royalty-free-jazz-chardonnay-dreams.mp3" controls></audio>
        </figure>
         <figure>
            <figcaption>Track 6: Spread your wings </figcaption>
            <audio src = "spread-your-wings-cinematic-background-music.mp3" controls></audio>
        </figure>
    </section>
    <section>
        <h2> Video Collection</h2>
        <figure>
            <figcaption>Video 1: Dj_Turnable</figcaption>
            <video src="Dj_turnable.mp4" width = "255" controls></video>
        </figure>
         <figure>
            <figcaption>Video 2: Having Fun at concert</figcaption>
            <video src="having_fun_at_concert.mp4" width = "250" controls></video>
        </figure>
         <figure>
            <figcaption>Video 3:Playing Guitar</figcaption>
            <video src="playing_guitar.mp4" width = " 255"  controls></video>
        </figure>
         <figure>
            <figcaption>Video 4: Playing piano</figcaption>
            <video src="playing_piano.mp4" width = "250" controls></video>
        </figure>
         <figure>
            <figcaption>Video 5: Singer on stage</figcaption>
            <video src="Singer_onStage.mp4" width = "255" controls></video>
        </figure>
    </section>
    </main>

</html>
