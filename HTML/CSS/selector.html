<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        div{
             background-color: red; 
        }
        /* Class selector */
        .red{
            background-color: red;
        }
        /* ID selector */
        #green{
            background-color: green;
        }
        /* child selector */
        div > p{
            color: blue;
            background-color: aquamarine;
        }
        /* decendant selector */
        div p{
             color: blue;
            background-color: aquamarine;

        }
        /* Universal selector */
        *{
            margin:0;
            padding: 0;
        }
        /* pseudo selector */
        a:visited{
            color: chartreuse;
        }

    </style>
</head>
<body>
    <div class = "red">
        I am a div.
        <article>
        <p>I am a para inside div.</p>
        </article>
    </div>
    <div id = "green">
        I am another div.
    </div>
    <div>
        <a href="https://www.gooogle.com">Go to Google</a>
    </div>
</body>
</html>
